[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "dockseal"
version = "1.0.0"
description = "Zero-dependency Dockerfile security auditor: root users, baked-in secrets, unpinned bases, pipe-to-shell - one pure-stdlib command, CI gate included"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Mehul Patel" }]
keywords = ["docker", "dockerfile", "security", "audit", "linter", "ci", "supply-chain", "devsecops"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
]

[project.urls]
Homepage = "https://github.com/mehulpatel23b-pixel/dockseal"

[project.scripts]
dockseal = "dockseal.cli:main"

[project.optional-dependencies]
dev = []

[tool.setuptools.packages.find]
where = ["src"]
